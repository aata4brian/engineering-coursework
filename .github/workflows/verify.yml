name: Coursework checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r projects/clustering/requirements.txt
      - run: python scripts/verify.py
      - run: python -m pip install -r projects/preprocessing/requirements.txt
      - run: python projects/preprocessing/check.py
      - run: python -m pip install -r projects/color-monitor/requirements.txt
      - run: python projects/color-monitor/check.py
      - run: python projects/queue-lab/check.py
      - run: python projects/c-basics/check.py
      - run: python projects/knn-svm-lab/check.py
